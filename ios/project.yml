name: WJXTester

options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  WJXTester:
    type: application
    platform: iOS
    sources:
      - path: WJXTester
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.wjxtester
        PRODUCT_NAME: WJXTester
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "问卷测试"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  WJXTester:
    build:
      targets:
        WJXTester: all
    run:
      config: Debug
    archive:
      config: Release
